name: Build extension repository

# Regenerates the index.json channels from the tools' GitHub Releases and
# deploys them (+ landing page) to GitHub Pages at blender.extendedmatrix.org.
#
# No archives are downloaded: the generator reads each release asset's sha256
# `digest` and `size` straight from the GitHub API, so a run is fast and cheap
# even though the EM zips are ~200 MB each.
#
# NOTE: GitHub Pages must be set to Source = "GitHub Actions"
# (Settings -> Pages), otherwise Pages runs Jekyll on the repo.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'        # nightly safety net: pick up new releases
  repository_dispatch:
    types: [tool-released]       # tools can ping this for an instant rebuild
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'repo_config.json'
      - 'public/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Generate index.json channels + landing page
        env:
          GH_TOKEN: ${{ github.token }}   # reads PUBLIC releases of the tool repos
        run: python3 scripts/build_repo.py --config repo_config.json --out dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── tell the next link in the chain that a release is out ──────────────
  # The chain: tool release → extension repository (blender.extendedmatrix.org)
  # → extendedmatrix.org, which reads the version where it is published.
  # Without the secret SITE_DISPATCH_TOKEN the step says so and does nothing:
  # the scheduled builds downstream still pick the release up. It never fails
  # the release. See ExtendedMatrix-site/docs/RELEASE-PROPAGATION.md.
  notify-release:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch «em-release» to zalmoxes-laran/ExtendedMatrix-site
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set: zalmoxes-laran/ExtendedMatrix-site will see this release at its next scheduled build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/zalmoxes-laran/ExtendedMatrix-site/dispatches \
            -d '{"event_type":"em-release","client_payload":{"repo":"${{ github.repository }}","ref":"${{ github.ref_name }}"}}' \
            || echo "::warning::dispatch to zalmoxes-laran/ExtendedMatrix-site failed; it will rebuild on its schedule"
